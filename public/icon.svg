<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ioclNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3b7a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="ioclSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#ioclNavy)" />
  <!-- Accent Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.15" />
  <!-- Forecourt Dispenser Body -->
  <rect x="156" y="140" width="200" height="250" rx="24" fill="#ffffff" />
  <!-- Display Screen -->
  <rect x="180" y="168" width="152" height="70" rx="12" fill="#0f172a" />
  <!-- Price / Volume Readouts -->
  <text x="195" y="198" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">₹ 96.50</text>
  <text x="195" y="224" fill="#ea580c" font-family="monospace" font-size="18" font-weight="bold">L 0.00</text>
  <!-- Nozzle Holster & Nozzle Hose -->
  <path d="M 356 220 C 390 220, 400 280, 400 330 C 400 360, 380 370, 365 350 L 356 340" fill="none" stroke="url(#ioclSaffron)" stroke-width="16" stroke-linecap="round" />
  <!-- Dispenser Base -->
  <rect x="140" y="380" width="232" height="24" rx="8" fill="#94a3b8" />
  <!-- SK Petroleum Badge -->
  <rect x="186" y="270" width="140" height="34" rx="8" fill="url(#ioclSaffron)" />
  <text x="256" y="293" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle">SK PETROL</text>
  <!-- Saffron Saffron Dot -->
  <circle cx="256" cy="336" r="14" fill="url(#ioclSaffron)" />
</svg>
